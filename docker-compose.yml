services:
  postgres:
    image: postgres:16-alpine
    container_name: drg-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drgagent
      POSTGRES_PASSWORD: drgagent_dev
      POSTGRES_DB: drg_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drgagent -d drg_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drg-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
