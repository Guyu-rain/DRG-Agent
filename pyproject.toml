[project]
name = "drg-agent"
version = "0.1.0"
description = "DRG-Agent: 医保 DRG 入组智能体系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "openai>=1.0.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "loguru>=0.7.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
    "mypy>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["server/migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N818: 业务异常基类按设计文档命名为 AppException (见 plans/phase1_backend.md §9)
ignore = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
